name: Original engine - Edge TTS demo

on:
  workflow_dispatch:
  push:
    branches: [codex/android-original-pipeline]
    paths:
      - .github/workflows/original-demo.yml
      - scripts/mobile/**

permissions:
  contents: read

jobs:
  original-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TTS_PROVIDER: edge-tts
      EDGE_TTS_VOICE: vi-VN-NamMinhNeural
      TTS_CONCURRENCY: '1'
      VIDEO_THEME: dark-neon
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r scripts/mobile/requirements.txt
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Find or install the browser used by HyperFrames
        run: npx --no-install hyperframes browser ensure
      - name: Run original tests and typecheck
        run: |
          npm test
          npm run typecheck
      - name: Copy original example without editing it
        run: |
          mkdir -p output/original-demo
          cp tests/fixtures/sample-script-no-image.json output/original-demo/script.json
      - name: Render with original pipeline and real free Edge TTS
        run: |
          python scripts/mobile/prepare_edge.py output/original-demo/script.json
          npm run pipeline -- output/original-demo/script.json
      - name: Decode MP4, measure audio and extract real frames
        run: node scripts/mobile/verify-video.mjs output/original-demo/video.mp4 output/original-demo/verification
      - name: Download demo and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: cuongit-original-demo-${{ github.run_number }}
          path: output/original-demo/
          if-no-files-found: error
          retention-days: 14
